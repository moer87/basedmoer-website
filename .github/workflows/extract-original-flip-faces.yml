name: Extract original Moer Flip result faces

on:
  push:
    branches: [pretestnet-ready]
    paths:
      - '.github/workflows/extract-original-flip-faces.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pretestnet-ready
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract face-on BASED and MOER frames from the original GIF
        shell: bash
        run: |
          pip install pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops, ImageStat
          import json

          src=Image.open('assets/basedmoer-token.gif')
          frames=[]
          for i in range(getattr(src,'n_frames',1)):
              src.seek(i)
              f=src.convert('RGBA')
              alpha=f.getchannel('A')
              bbox=alpha.getbbox()
              area=0 if not bbox else (bbox[2]-bbox[0])*(bbox[3]-bbox[1])
              px=f.load(); blue=purple=opaque=0
              for y in range(f.height):
                  for x in range(f.width):
                      r,g,b,a=px[x,y]
                      if a<80: continue
                      opaque+=1
                      if b>110 and b>r*1.18 and b>g*1.04: blue+=(b-r)+(b-g)
                      if r>65 and b>80 and b>g*1.12 and r>g*1.05: purple+=(r-g)+(b-g)
              frames.append({'index':i,'image':f.copy(),'area':area,'opaque':opaque,'blue':blue,'purple':purple})
          if len(frames)<2:
              raise SystemExit('Original coin GIF does not contain multiple frames')
          max_area=max(x['area'] for x in frames) or 1
          face_candidates=[x for x in frames if x['area']>=max_area*.82]
          based=max(face_candidates,key=lambda x:(x['blue']-x['purple']*.20,x['area']))
          def diff_score(candidate):
              a=based['image'].convert('RGB').resize((64,64))
              b=candidate['image'].convert('RGB').resize((64,64))
              stat=ImageStat.Stat(ImageChops.difference(a,b))
              visual=sum(stat.mean)
              cyclic=min((candidate['index']-based['index'])%len(frames),(based['index']-candidate['index'])%len(frames))
              return visual + cyclic*.20 + candidate['purple']*.00001 - candidate['blue']*.000003
          moer=max((x for x in face_candidates if x['index']!=based['index']),key=diff_score)
          based['image'].save('assets/flip-based.png',optimize=True)
          moer['image'].save('assets/flip-moer.png',optimize=True)
          Path('assets/flip-result-frames.json').write_text(json.dumps({
              'source':'basedmoer-token.gif',
              'frame_count':len(frames),
              'based_frame':based['index'],
              'moer_frame':moer['index'],
              'method':'face-on area filter; BASED selected by Base-blue dominance; MOER selected as the maximally distinct face-on original frame'
          },indent=2))
          print('frame_count',len(frames),'BASED',based['index'],'MOER',moer['index'])
          PY
      - name: Make the original GIF animate, then stop on extracted original result face
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('moer-flip/index.html')
          s=p.read_text()
          s=re.sub(r"async function decodeCoin\(\)\{.*?\}\nfunction startOriginalAnimation", "function startOriginalAnimation", s, flags=re.S)
          s=re.sub(r"async function freezeOriginalFace\(outcome\)\{.*?\}\nasync function landOn", "function freezeOriginalFace(outcome){const gif=document.getElementById('coinGif'),canvas=document.getElementById('coinCanvas');canvas.classList.remove('show');gif.classList.remove('freeze');gif.src=outcome==='BASED'?'/assets/flip-based.png':'/assets/flip-moer.png';return true}\nasync function landOn", s, flags=re.S)
          s=s.replace("const frozen=await freezeOriginalFace(outcome);", "const frozen=freezeOriginalFace(outcome);")
          s=s.replace("decodeCoin();if(preview){", "if(preview){")
          p.write_text(s)
          PY
      - name: Verify exact-source assets and browser script
        shell: bash
        run: |
          test -s assets/flip-based.png
          test -s assets/flip-moer.png
          test -s assets/flip-result-frames.json
          grep -q '/assets/flip-based.png' moer-flip/index.html
          grep -q '/assets/flip-moer.png' moer-flip/index.html
      - name: Commit exact result frames and remove helper
        shell: bash
        run: |
          git config user.name 'moer-pretestnet-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/flip-based.png assets/flip-moer.png assets/flip-result-frames.json moer-flip/index.html
          git rm .github/workflows/extract-original-flip-faces.yml
          git commit -m 'Freeze Moer Flip on exact frames from original coin GIF'
          git push origin HEAD:pretestnet-ready
