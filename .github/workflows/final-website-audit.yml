name: Final website visual-master audit

on:
  push:
    branches:
      - final-website-working-5
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify every page, internal reference and locked visual master
        run: python scripts/final_site_audit.py
      - name: Verify phone compatibility across every public and demo page
        run: python scripts/mobile_site_audit.py
      - name: Verify Base Account integration remains non-custodial
        shell: bash
        run: |
          set -euo pipefail
          grep -q "@base-org/account@2.5.10" base-login.js
          grep -q "requestSpendPermission" base-account.js
          grep -q "requestRevoke" base-account.js
          grep -qi "execution remains locked" base-account.js
          if grep -R -nE '(PRIVATE_KEY|SEED_PHRASE|MNEMONIC|SUPABASE_SERVICE_ROLE|DISCORD_WEBHOOK_URL)[[:space:]]*[:=]' --include='*.js' --include='*.html' .; then
            echo 'Credential-like assignment found in browser source'
            exit 1
          fi
