name: One-time Moer branding cleanup

on:
  push:
    branches:
      - pretestnet-ready

permissions:
  contents: write

jobs:
  cleanup:
    if: "!contains(github.event.head_commit.message, '[moer-branding-cleanup]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: pretestnet-ready
          fetch-depth: 0

      - name: Normalize public-facing Moer branding
        shell: python
        run: |
          from pathlib import Path

          replacements = [
              ("MOE TOKEN RADAR", "MOER TOKEN RADAR"),
              ("Moe Token Radar", "Moer Token Radar"),
              ("MOE SCANNER", "MOER SCANNER"),
              ("Moe Scanner", "Moer Scanner"),
              ("MOE AGENT", "MOER AGENT"),
              ("Moe Agent", "Moer Agent"),
              ("MOE AI", "MOER AI"),
              ("Moe AI", "Moer AI"),
          ]
          text_suffixes = {".html", ".js", ".css", ".json", ".txt", ".md", ".py", ".yml", ".yaml"}
          skip = {Path(".github/workflows/branding-cleanup.yml")}
          changed = []

          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts or path in skip:
                  continue
              if path.suffix.lower() not in text_suffixes:
                  continue
              try:
                  original = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              updated = original
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != original:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(str(path))

          print("Branding-normalized files:")
          for item in changed:
              print(f" - {item}")

      - name: Remove one-time workflow
        run: rm -f .github/workflows/branding-cleanup.yml

      - name: Commit cleanup
        run: |
          git config user.name "Based Moer Branding Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No branding changes required."
            exit 0
          fi
          git commit -m "Normalize public branding to Moer [moer-branding-cleanup]"
          git push origin HEAD:pretestnet-ready
