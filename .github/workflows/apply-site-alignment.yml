name: Apply site alignment
on:
  push:
    branches: [pretestnet-ready]
    paths: ['.github/workflows/apply-site-alignment.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pretestnet-ready
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Align holder pages and previews
        run: |
          python - <<'PY'
          from pathlib import Path

          # Profile: load progression statically so creator preview works after DOMContentLoaded.
          p=Path('profile/index.html')
          s=p.read_text()
          s=s.replace('<script src="/shared.js"></script><script>', '<script src="/shared.js"></script><script src="/progression.js"></script><script>', 1)
          s=s.replace('Modules Complete</span><strong id="profileCompleted">0 / 21', 'Modules Complete</span><strong id="profileCompleted">0 / 24')
          s=s.replace("profileCompleted.textContent=done+' / 21'", "profileCompleted.textContent=done+' / 24'")
          s=s.replace("if(done>=21)return'Moerverse Market Analyst'", "if(done>=24)return'Moerverse Market Analyst'")
          s=s.replace("['MV','Moerverse Market Analyst',21]", "['MV','Moerverse Market Analyst',24]")
          s=s.replace("['Base & Onchain','onchain']", "['Base & Onchain','onchain'],['Token Radar','radar']")
          s=s.replace("<p style=\"color:var(--muted)\">Ready for the game lifecycle. These stats will activate when Moer Flip launches.</p>", "<p style=\"color:var(--muted)\">Moer Flip XP Edition is live for holders with three free daily plays. Wins and participation contribute to Passport progression.</p>")
          p.write_text(s)

          # Academy: load XP sync statically.
          p=Path('academy/index.html')
          s=p.read_text()
          if '/academy-xp.js' not in s:
              s=s.replace('<script src="/academy/deep-dive.js"></script>', '<script src="/academy/deep-dive.js"></script><script src="/academy-xp.js"></script>')
          p.write_text(s)

          # Live: ensure Radar orientation + weekly tracker boot on every load.
          p=Path('live/index.html')
          s=p.read_text()
          if '/radar-xp.js' not in s:
              s=s.replace('<script src="/agent.js"></script>', '<script src="/agent.js"></script><script src="/radar-xp.js"></script>')
          p.write_text(s)

          # Homepage: fit coin correctly, wire preferred GIF with safe static fallback, and preferred Academy v2 art with old fallback.
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<img src="/assets/moe-academy-home.png" alt="Moe Academy learning terminal">', '<img src="/assets/moe-academy-home-v2.png" onerror="this.onerror=null;this.src=\'/assets/moe-academy-home.png\'" alt="Moe Academy learning terminal">')
          s=s.replace('<img src="/assets/spaceship-main.png" alt="Original blue Moerverse Arcade spaceship" style="transform:rotate(90deg);width:62%;height:62%">', '<img src="/assets/spaceship-main.gif" onerror="this.onerror=null;this.src=\'/assets/spaceship-main.png\'" alt="Original animated blue Moerverse Arcade spaceship" style="transform:rotate(90deg);width:74%;height:74%;object-fit:contain">')
          s=s.replace('<img src="/assets/basedmoer-token.gif" alt="Original Based Moer animated coin">', '<img src="/assets/basedmoer-token.gif" alt="Original Based Moer animated coin" style="width:76%;height:76%;object-fit:contain">')
          p.write_text(s)

          # Moerverse: replace stale holder-benefit copy with the current product map.
          p=Path('moerverse/index.html')
          s=p.read_text()
          start=s.index('<div class="world-grid">')
          end=s.index('</div><div class="benefit-note">', start)
          cards='''<div class="world-grid"><div class="world-card"><h3>Moe Scanner v3.1</h3><p>Holder access to the live 4H structure-break and Fibonacci pullback engine, with versioned setups, entry zones, invalidation, targets and conservative lifecycle tracking.</p></div><div class="world-card"><h3>Moe Token Radar</h3><p>A separate 7-day discovery engine for Base and Solana tokens. It tracks weekly structure, liquidity, market cap, volume/turnover and risk flags. It remains discovery-only and is not an Agent execution feed.</p></div><div class="world-card"><h3>Moe Agent • Base Shadow</h3><p>Paper/shadow execution that consumes eligible Scanner v3.1 LONG signals, requests real read-only Base routes, applies safety limits and records outcomes while live funds stay locked.</p></div><div class="world-card"><h3>Moe Academy v3</h3><p>24 holder modules across eight tracks, with deep dives, lesson-specific visuals, practice, exams and MOER XP synchronization.</p></div><div class="world-card"><h3>Moerverse Arcade</h3><p>A holder pixel-space shooter with original ship art, escalating combat, power-ups, boss encounters, mobile/desktop controls and server-validated MOER XP runs.</p></div><div class="world-card"><h3>Moer Flip • XP Edition</h3><p>Three free holder plays per day using the original Based/Moer animated pixel coin. No paid wagering is enabled; outcomes award capped MOER XP.</p></div><div class="world-card"><h3>Moerverse Passport</h3><p>The holder identity hub for wallet ownership, selected NFT identity, Academy progress, titles, MOER XP, frames, headers, ship cosmetics and game progress.</p></div><div class="world-card"><h3>MOER XP & Cosmetics</h3><p>Non-transferable progression earned from verified Moerverse activity. XP unlocks titles, profile frames, headers, Arcade ships and future cosmetic experiences.</p></div><div class="world-card"><h3>Future Drops & Fragments</h3><p>Future art drops, partner experiences, seasonal Arcade events, profile cosmetics and other Moerverse fragments can expand the ecosystem without requiring a fungible token today.</p></div></div>'''
          s=s[:start]+cards+s[end+6:]
          p.write_text(s)
          PY
      - name: Validate edited pages
        run: |
          python - <<'PY'
          from pathlib import Path
          checks={
            'profile/index.html':['/progression.js','MOERVERSE PROGRESSION'],
            'academy/index.html':['/academy-xp.js','24 MODULES'],
            'live/index.html':['/radar-xp.js','MOE SCANNER v3.1'],
            'index.html':['moe-academy-home-v2.png','spaceship-main.gif'],
            'moerverse/index.html':['Moerverse Arcade','Moe Token Radar','MOER XP & Cosmetics','Moe Agent • Base Shadow']
          }
          # MOERVERSE PROGRESSION is injected by progression.js, so validate profile script instead.
          checks['profile/index.html']=['/progression.js','0 / 24']
          for f,needles in checks.items():
            t=Path(f).read_text()
            for n in needles:
              assert n in t,(f,n)
          print('site alignment checks passed')
          PY
      - name: Commit alignment
        run: |
          git config user.name 'moer-pretestnet-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html profile/index.html academy/index.html live/index.html moerverse/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Align holder products, previews and current Moerverse map'
          git push origin HEAD:pretestnet-ready
