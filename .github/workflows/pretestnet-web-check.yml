name: Website pre-testnet gate

on:
  workflow_dispatch:
  push:
    branches: [pretestnet-ready, final-website-working-5]
  pull_request:
    paths:
      - '**/*.html'
      - '**/*.js'
      - '**/*.css'
      - 'assets/**'
      - '.github/workflows/pretestnet-web-check.yml'

permissions:
  contents: read

jobs:
  web-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check shared.js
          node --check agent.js
          node --check progression.js
          node --check academy-xp.js
          node --check radar-xp.js
          node --check arcade/arcade.js
          node --check arcade/event-demo.js
          node --check arcade/anomaly-preview.js
          node --check academy/academy.js
          node --check live/radar-weekly.js
      - name: Required route files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f moerverse/index.html
          test -f live/index.html
          test -f academy/index.html
          test -f moer-flip/index.html
          test -f arcade/index.html
          test -f arcade/event-preview.html
          test -f arcade/anomaly-preview.html
          test -f profile/index.html
          test -f profile/legend-preview.html
          test -f docs/index.html
          test -f status/index.html
      - name: Original artwork invariants
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/bald-moe-promo.gif
          test -s assets/ape-punks.gif
          test -s assets/moe-ai.mp4
          test -s assets/moerverse-preview.png
          test -s assets/academy.gif
          test -s assets/arcade.gif
          test -s assets/moer-flip.gif
          test -s assets/basedmoer-token.gif
          test -s assets/spaceship-main.png
          test -s assets/spaceship-red.png
          test -s assets/spaceship-cyan.png
          test -s assets/base-blockchain-logo.jpg
          grep -q "/assets/bald-moe-promo.gif" index.html
          grep -q "/assets/moerverse-preview.png" index.html
          grep -q "/assets/ape-punks.gif" index.html
          grep -q "/assets/moe-ai.mp4" index.html
          grep -q "/assets/academy.gif" index.html
          grep -q "/assets/arcade.gif" index.html
          grep -q "/assets/moer-flip.gif" index.html
          grep -q "/assets/basedmoer-token.gif" moer-flip/index.html
          grep -q "data-choice=\"BASED\"" moer-flip/index.html
          grep -q "data-choice=\"MOER\"" moer-flip/index.html
          grep -q "/assets/spaceship-main.png" arcade/arcade.js
          grep -q "/assets/spaceship-main.png" arcade/anomaly-preview.html
          grep -q "Math.PI/2" arcade/arcade.js
          grep -q "/assets/base-blockchain-logo.jpg" index.html
          ! grep -q "ethereum-original.svg" index.html
      - name: Input controls
        shell: bash
        run: |
          set -euo pipefail
          grep -q "KeyW" arcade/arcade.js
          grep -q "KeyA" arcade/arcade.js
          grep -q "KeyS" arcade/arcade.js
          grep -q "KeyD" arcade/arcade.js
          grep -q "PointerFire" arcade/arcade.js
          grep -q "pointerdown" arcade/arcade.js
          grep -q 'data-key="ArrowDown"' arcade/index.html
          grep -q 'data-key="Space"' arcade/index.html
      - name: Product-state invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q "MOE AGENT v0.2" live/index.html
          grep -q "LIVE FUNDS LOCKED" live/index.html
          grep -q "preview=holder" shared.js
          grep -q "DISCOVERY ONLY" live/radar-weekly.js
          grep -q "/v1/radar/preview" live/radar-weekly.js
          grep -q "NO XP SAVED" arcade/arcade.js
          grep -q "DEMO ONLY" arcade/anomaly-preview.html
          grep -q "preview only, no XP saved" moer-flip/index.html
          grep -q "Moer Academy" index.html
          grep -q "Moer Flip Game" index.html
          grep -q "MOER ACADEMY v3" academy/index.html
          grep -q "@base-org/account@2.5.10" base-login.js
          grep -q "requestSpendPermission" base-account.js
          grep -q "requestRevoke" base-account.js
      - name: No accidental browser secrets
        shell: bash
        run: |
          set -euo pipefail
          for term in SUPABASE_SERVICE_ROLE PRIVATE_KEY SEED_PHRASE DISCORD_WEBHOOK_URL; do
            if grep -R -n -F "$term" --include='*.js' --include='*.html' --include='*.css' .; then
              echo "Forbidden browser secret marker found: $term"
              exit 1
            fi
          done
          if grep -R -n -E 'MOE_AI_API_KEY[[:space:]]*=' --include='*.js' --include='*.html' --include='*.css' .; then
            echo 'Moe AI API key assignment found in browser source'
            exit 1
          fi
