name: Fix Arcade syntax

on:
  push:
    branches: [pretestnet-ready]
    paths:
      - '.github/workflows/fix-arcade-syntax.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pretestnet-ready
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove extra HUD brace and verify syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('arcade/arcade.js')
          s=p.read_text()
          old="if($('bossHp')){$('bossHp').textContent=boss?`${Math.max(0,boss.hp)} / ${boss.maxHp}`:bossKilled?'DOWN':'—'}}}"
          new="if($('bossHp')){$('bossHp').textContent=boss?`${Math.max(0,boss.hp)} / ${boss.maxHp}`:bossKilled?'DOWN':'—'}}"
          if old not in s:
              raise SystemExit('expected extra-brace pattern not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --check arcade/arcade.js
      - name: Commit fix and remove helper
        shell: bash
        run: |
          git config user.name 'moer-pretestnet-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add arcade/arcade.js
          git rm .github/workflows/fix-arcade-syntax.yml
          git commit -m 'Fix Arcade HUD syntax detected by CI'
          git push origin HEAD:pretestnet-ready
