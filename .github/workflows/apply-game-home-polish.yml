name: Apply game and homepage polish

on:
  push:
    branches: [pretestnet-ready]
    paths:
      - '.github/workflows/apply-game-home-polish.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pretestnet-ready
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download Moe Academy homepage art
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/b4107c8f-1173-4efd-b55f-0102af2abeee.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYjQ1MGUwM2RmMWQ4ZTQwZCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4ODEyMzk2NX0.zS5I3BoHqHnwAdYMkR7Tdg0z0XeKl49tWFsbjfuJLWU' -o assets/moe-academy-home.png
          test -s assets/moe-academy-home.png
      - name: Patch Arcade controls and orientation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('arcade/arcade.js')
          s=p.read_text()
          old="function drawPlayer(){ctx.save();if(player.invuln>0&&Math.floor(player.invuln*12)%2===0)ctx.globalAlpha=.35;const skin=localStorage.getItem('moerArcadeShip')||'';const art=skin==='ship_void_runner'?shipImages.red:skin==='ship_moe_scout'?shipImages.cyan:shipImages.main;if(originalShipReady&&art.complete&&art.naturalWidth){ctx.imageSmoothingEnabled=false;ctx.drawImage(art,Math.round(player.x-10),Math.round(player.y-13),84,84)}else drawFallbackShip(player.x,player.y);if(rapid>0||spread>0){ctx.globalAlpha=.55;ctx.strokeStyle=rapid>0?'#5affd3':'#b98cff';ctx.lineWidth=2;ctx.strokeRect(Math.round(player.x-5),Math.round(player.y-5),74,56)}ctx.restore()}"
          new="function drawPlayer(){ctx.save();if(player.invuln>0&&Math.floor(player.invuln*12)%2===0)ctx.globalAlpha=.35;const skin=localStorage.getItem('moerArcadeShip')||'';const art=skin==='ship_void_runner'?shipImages.red:skin==='ship_moe_scout'?shipImages.cyan:shipImages.main;if(originalShipReady&&art.complete&&art.naturalWidth){ctx.imageSmoothingEnabled=false;const cx=player.x+32,cy=player.y+23;ctx.translate(Math.round(cx),Math.round(cy));ctx.rotate(Math.PI/2);ctx.drawImage(art,-42,-42,84,84);ctx.rotate(-Math.PI/2);ctx.translate(-Math.round(cx),-Math.round(cy))}else drawFallbackShip(player.x,player.y);if(rapid>0||spread>0){ctx.globalAlpha=.55;ctx.strokeStyle=rapid>0?'#5affd3':'#b98cff';ctx.lineWidth=2;ctx.strokeRect(Math.round(player.x-5),Math.round(player.y-5),74,56)}ctx.restore()}"
          if old not in s: raise SystemExit('drawPlayer source changed; refusing unsafe patch')
          s=s.replace(old,new)
          s=s.replace("if(keys.Space)shoot();shotTimer=", "if(keys.Space||keys.PointerFire)shoot();shotTimer=")
          marker="window.addEventListener('keydown'"
          if marker not in s: raise SystemExit('keyboard marker missing')
          insert="canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){keys.PointerFire=true;shoot();e.preventDefault()}});window.addEventListener('pointerup',()=>{keys.PointerFire=false});canvas.addEventListener('contextmenu',e=>e.preventDefault());\n"
          s=s.replace(marker,insert+marker,1)
          p.write_text(s)
          PY
      - name: Patch Arcade mobile touch panel and copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('arcade/index.html'); s=p.read_text()
          s=s.replace('.mobile-controls{display:none;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.mobile-controls button{min-height:48px}.fire{grid-column:1/4}', '.mobile-controls{display:none;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;touch-action:none;user-select:none}.mobile-controls button{min-height:54px;touch-action:none}.mobile-controls .up{grid-column:2}.mobile-controls .left{grid-column:1;grid-row:2}.mobile-controls .down{grid-column:2;grid-row:2}.mobile-controls .right{grid-column:3;grid-row:2}.mobile-controls .fire{grid-column:4;grid-row:1/3;font-size:16px}')
          old='<div class="mobile-controls"><button class="button secondary" data-key="ArrowLeft">◀</button><button class="button secondary" data-key="ArrowUp">▲</button><button class="button secondary" data-key="ArrowRight">▶</button><button class="button secondary fire" data-key="Space">FIRE</button></div>'
          new='<div class="mobile-controls" aria-label="Touch flight controls"><button class="button secondary up" data-key="ArrowUp">▲</button><button class="button secondary left" data-key="ArrowLeft">◀</button><button class="button secondary down" data-key="ArrowDown">▼</button><button class="button secondary right" data-key="ArrowRight">▶</button><button class="button fire" data-key="Space">FIRE</button></div>'
          if old not in s: raise SystemExit('mobile controls source changed')
          s=s.replace(old,new)
          s=s.replace('MOVE: WASD / ARROWS • FIRE: SPACE • CYAN = RAPID', 'DESKTOP: WASD / ARROWS • FIRE: SPACE OR HOLD/CLICK MOUSE • PHONE: TOUCH D-PAD + FIRE • CYAN = RAPID')
          s=s.replace('The game code is already wired to load your original uploaded spaceship from <code>/assets/spaceshipa.gif</code> when that binary asset is present; otherwise it uses a hand-reconstructed pixel fallback with the same blue spacecraft direction.', 'The playable ships use your original uploaded pixel spacecraft artwork. The source sprites face north, so the game rotates them 90° clockwise at render time to face the combat direction without modifying your source files.')
          p.write_text(s)
          PY
      - name: Build three-material holder experience on homepage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          s=s.replace('.experience-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;max-width:900px;margin:auto}.experience-card{padding:25px;border:1px solid #26344d;border-radius:18px;background:#101827}.experience-card h3{margin:8px 0}', '.experience-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;max-width:1080px;margin:auto}.experience-card{padding:18px;border:1px solid #26344d;border-radius:18px;background:#101827;overflow:hidden}.experience-card h3{margin:10px 0 8px}.experience-media{width:100%;height:230px;display:grid;place-items:center;background:#070d17;border:1px solid #26344d;border-radius:12px;overflow:hidden;margin-bottom:17px}.experience-media img{width:100%;height:100%;object-fit:contain;image-rendering:auto}.experience-media.pixel img{image-rendering:pixelated}.experience-card a{text-decoration:none;color:inherit}')
          s=s.replace('@media(max-width:800px){.grid2,.tech,.split,.experience-grid{grid-template-columns:1fr}', '@media(max-width:800px){.grid2,.tech,.split,.experience-grid{grid-template-columns:1fr}')
          old='<div class="experience-grid"><div class="experience-card"><span class="eyebrow">LEARN</span><h3>Moe Academy</h3><p>A structured holder curriculum with lessons, lesson-specific visuals, exams, progress tracking, titles and MOER XP progression.</p></div><div class="experience-card"><span class="eyebrow">PLAY</span><h3>Moer Flip + Arcade</h3><p>Free holder games connected to Passport progression. No paid wagering is enabled in the current XP editions.</p></div></div><div style="max-width:260px;margin:24px auto 0"><img class="media" src="/assets/basedmoer-token.gif" alt="Based Moer artwork"></div>'
          new='<div class="experience-grid"><a class="experience-card" href="/academy/"><div class="experience-media"><img src="/assets/moe-academy-home.png" alt="Moe Academy learning terminal"></div><span class="eyebrow">LEARN</span><h3>Moe Academy</h3><p>A structured holder curriculum with lessons, lesson-specific visuals, exams, progress tracking, titles and MOER XP progression.</p></a><a class="experience-card" href="/arcade/"><div class="experience-media pixel"><img src="/assets/spaceship-main.png" alt="Original blue Moerverse Arcade spaceship" style="transform:rotate(90deg);width:62%;height:62%"></div><span class="eyebrow">PLAY</span><h3>Moerverse Arcade</h3><p>Fly your original Moerverse ship through holder-only pixel combat, boss encounters and Passport-linked XP progression.</p></a><a class="experience-card" href="/moer-flip/"><div class="experience-media pixel"><img src="/assets/basedmoer-token.gif" alt="Original Based Moer animated coin"></div><span class="eyebrow">PLAY</span><h3>Moer Flip</h3><p>Choose BASED or MOER with your original animated pixel coin. Current XP edition has no paid wagering.</p></a></div>'
          if old not in s: raise SystemExit('holder experience source changed')
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          node --check arcade/arcade.js
          grep -q 'Math.PI/2' arcade/arcade.js
          grep -q 'PointerFire' arcade/arcade.js
          grep -q 'ArrowDown' arcade/index.html
          grep -q '/assets/moe-academy-home.png' index.html
          grep -q 'rotate(90deg)' index.html
          git config user.name 'moer-pretestnet-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/moe-academy-home.png arcade/arcade.js arcade/index.html index.html
          git rm .github/workflows/apply-game-home-polish.yml
          git commit -m 'Polish Arcade controls and add holder experience media'
          git push origin HEAD:pretestnet-ready
