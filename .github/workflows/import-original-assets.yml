name: Import original Moerverse artwork

on:
  push:
    branches: [pretestnet-ready]
    paths:
      - '.github/workflows/import-original-assets.yml'

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pretestnet-ready
      - name: Download exact original user uploads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          curl -fsSL 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/21fcfad1-7a0c-4462-aad2-62ac5195860c.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMDQ3MjI5OWQyYjRjNTJhNyIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4ODE2MTgyMX0.wZxqsT4pAiuLz-yrllcUyEY9ths8VKH3CmDNF0kZQbw' -o assets/spaceship-red.png
          curl -fsSL 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/9299b5e7-568d-47c5-bee8-b743925e66bb.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiODNkMjI2ZGY0MTliYWMwNiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4ODE0MTQwN30.16Kmz8u4Soh0iN3KsJAvM-rlI70xYxG_Z5SgTlvNA2Y' -o assets/spaceship-main.png
          curl -fsSL 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/16bc9f92-a982-474a-93ed-6b6a0f8e1779.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMDgyMzk4YTEzZThjNzgyOCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4ODE3Mjk2MX0.yHBXjiRxjLNxRv_eukQAUYDLg-_sLrlnmnFNUg-qnQQ' -o assets/spaceship-cyan.png
          curl -fsSL 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/05d66ba3-8420-4161-9099-ff323858cf33.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMGJjMzdjNWY4NjNjMzNiMiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4ODE1NzUzNX0.K7083ahg_vKH7aTavdOoT1vNhZS3RYMpTtHBU9SjuMU' -o assets/base-blockchain-logo.jpg
          file assets/spaceship-red.png assets/spaceship-main.png assets/spaceship-cyan.png assets/base-blockchain-logo.jpg
      - name: Commit original assets and remove temporary importer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'moer-pretestnet-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/spaceship-red.png assets/spaceship-main.png assets/spaceship-cyan.png assets/base-blockchain-logo.jpg
          git rm .github/workflows/import-original-assets.yml
          git commit -m 'Import exact original spaceship and Base logo artwork'
          git push origin HEAD:pretestnet-ready
